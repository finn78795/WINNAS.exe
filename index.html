<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | winnas</title>
    <!-- Viewport definition for all devices to ensure proper layout scale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden; /* Prevents scrollbars */
        background: #231F20;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <!-- Hardcoded width, height, and inline pixel styles removed -->
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    
    <script src="Build/projectbuilds.loader.js"></script>
    <script>
      // Extra safety checks for smooth rendering
      var canvas = document.querySelector("#unity-canvas");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile-specific layout overrides if needed
        canvas.style.position = "fixed";
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/projectbuilds.data.unityweb",
        frameworkUrl: "Build/projectbuilds.framework.js.unityweb",
        codeUrl: "Build/projectbuilds.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "finn78795",
        productName: "winnas",
        productVersion: "2.5",
        // Force the WebGL render buffer to match the CSS canvas scale
        matchWebGLToCanvasSize: true, 
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
